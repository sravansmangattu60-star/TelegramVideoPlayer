<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cloud Video Player</title>
</head>

<body style="background:#111;color:white;font-family:Arial;padding:20px">

<h1>🎬 Cloud Video Player</h1>

<input id="link"
placeholder="Paste TeraBox, DiskWala or Flezen link"
style="width:80%;padding:12px">

<button id="play" style="padding:12px">PLAY</button>

<p id="status">Ready</p>

<video id="player" controls playsinline
style="width:100%;max-width:700px;margin-top:20px"></video>

<script>

const input = document.getElementById("link");
const player = document.getElementById("player");
const status = document.getElementById("status");

document.getElementById("play").onclick = function () {

    const url = input.value.trim().toLowerCase();

    if (!url) {
        status.textContent = "Paste a link.";
        return;
    }

    const allowed =
        url.includes("terabox.com") ||
        url.includes("teraboxlink.com") ||
        url.includes("diskwala.com") ||
        url.includes("flezen.com");

    if (!allowed) {
        status.textContent =
            "Only TeraBox, DiskWala or Flezen links are allowed.";
        player.removeAttribute("src");
        player.load();
        return;
    }

    status.textContent = "Resolving...";

    // Resolver will be connected here next.
    status.textContent =
        "Valid link detected. Resolver required.";
};

</script>

</body>
</html>
